- name: Install and Configure Node Exporter on all servers
  hosts: all
  become: true
  vars:
    link: https://github.com/prometheus/node_exporter/releases/download/v1.10.2/node_exporter-1.10.2.linux-amd64.tar.gz
    file_path: /tmp/node_exporter-1.10.2.linux-amd64.tar.gz
    extract_dir: /tmp/node_exporter-1.10.2.linux-amd64  
    service_name: node_exporter
  tasks:
    - name: Create a user for node_exporter
      ansible.builtin.user:
        name: node_exporter
        shell: /bin/false
        createk_home: no

    - name: Download node_exporter
      ansible.builtin.get_url:
        url: "{{ link }}"
        dest: /tmp

    - name: Extract the archive
      ansible.builtin.unarchive:
        src: "{{ file_path }}"
        dest: /tmp
        remote_src: yes  

    - name: Copy the binary
      ansible.builtin.copy:
        src: "{{ extract_dir }}/node_exporter"  
        dest: /usr/local/bin/node_exporter
        remote_src: yes                           
        mode: '0755'
        owner: node_exporter
        group: node_exporter

    - name: Create a systemd service
      ansible.builtin.copy:
        src: node_exporter.service
        dest: /etc/systemd/system/node_exporter.service

    - name: Start and enable service
      ansible.builtin.systemd:
        name: "{{ service_name }}"
        state: started
        enabled: yes
        daemon_reload: yes

    - name: clean up temporary files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ file_path }}"
        - "{{ extract_dir }}"