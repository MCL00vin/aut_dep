---
- name: installing and configuring keepalived
  hosts: loadbalancers
  become: true

  tasks:
    - name: install keepalived
      apt:
        name: keepalived
        state: latest
        update_cache: yes

    - name: deploy keepalived configuration
      template:
        src: keepalived.conf.j2
        dest: /etc/keepalived/keepalived.conf
      notify: Restart Keepalived

  handlers:
    - name: Restart Keepalived
      service:
        name: keepalived
        state: restarted

- name: installing and configuring HAProxy for the frontend
  hosts: loadbalancers
  become: true

  vars:
    virtual_ip: "10.10.10.100"
    backend_servers:
      - { name: "web-node-1", ip: "10.10.10.10" }
      - { name: "web-node-2", ip: "10.10.10.11" }
    backend_port: 30080

    # TLS termination settings
    haproxy_ssl_cert_path: "/etc/ssl/private/haproxy.pem"
    haproxy_ssl_cert_src: "files/haproxy.pem"   # local path to the combined cert+key you already generated

    # Timeouts (kept as strings so the "s" suffix from the new config is preserved)
    haproxy_timeout_connect: "5s"
    haproxy_timeout_client: "50s"
    haproxy_timeout_server: "50s"

  tasks:
    - name: allow HAProxy to bind to VIP (non-local bind)
      sysctl:
        name: net.ipv4.ip_nonlocal_bind
        value: '1'
        state: present
        reload: yes

    - name: installing HAProxy
      apt:
        name: haproxy
        state: latest
        update_cache: yes

    - name: deploy TLS certificate/key for HAProxy
      copy:
        src: "{{ haproxy_ssl_cert_src }}"
        dest: "{{ haproxy_ssl_cert_path }}"
        owner: haproxy
        group: haproxy
        mode: '0640'
      notify: Restart HAProxy

    - name: deploy HAProxy configuration
      template:
        src: haproxy.cfg.j2
        dest: /etc/haproxy/haproxy.cfg
        mode: '0644'
      notify: Restart HAProxy

  handlers:
    - name: Restart HAProxy
      service:
        name: haproxy
        state: restarted